<div class="flex gap-4 top-8 right-8" [class.fixed]="float()">
    <button pButton type="button" (click)="toggleDarkMode()" [rounded]="true" severity="secondary">
        <span pButtonIcon [class]="isDarkTheme() ? 'pi pi-moon' : 'pi pi-sun'"></span>
    </button>
    <div class="relative">
        <button pButton pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-scalein"
                leaveToClass="hidden" leaveActiveClass="animate-fadeout" [hideOnOutsideClick]="true" type="button"
                rounded>
            <span pButtonIcon class="pi pi-palette"></span>
        </button>
        <app-configurator />
    </div>
</div>
