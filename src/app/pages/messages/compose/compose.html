<div class="grid grid-cols-12 gap-6">
    <div class="col-span-12 lg:col-start-2 lg:col-span-10">
        <div class="card">
            <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0 m-0">Compose</h2>
                    <p class="text-muted-color text-sm m-0">Send a new message</p>
                </div>
                <div class="flex items-center gap-2">
                    <a pButton label="Back to Inbox" severity="secondary" [outlined]="true" routerLink="/pages/messages/inbox"></a>
                </div>
            </div>

            <form class="flex flex-col gap-6" [formGroup]="form" (ngSubmit)="send()">
                <div class="flex flex-col gap-2">
                    <label for="recipients" class="font-medium text-surface-900 dark:text-surface-0">To</label>
                    <div class="flex flex-wrap items-center gap-2">
                        <input
                            id="recipients"
                            pInputText
                            type="text"
                        [value]="recipientInput()"
                        (input)="onRecipientInput($event)"
                        (keydown.enter)="addRecipient($event)"
                        (blur)="addRecipient($event)"
                        placeholder="Add recipient and press Enter"
                        aria-describedby="recipients-help"
                        tabindex="1"
                        aria-label="Recipients"
                        class="flex-1 min-w-60"
                    />
                    <button pButton type="button" label="Add" (click)="addRecipient()"></button>
                </div>
                <small id="recipients-help" class="text-muted-color">Press Enter to add; duplicates are ignored.</small>

                @if (form.controls.recipients.value.length) {
                    <div class="flex flex-wrap gap-2 mt-2">
                            @for (recipient of form.controls.recipients.value; track recipient) {
                                <span class="inline-flex items-center gap-2 rounded-full bg-surface-100 dark:bg-surface-800 text-sm px-3 py-1">
                                    <span>{{ recipient }}</span>
                                    <button
                                        type="button"
                                        class="p-button p-button-text p-button-sm"
                                        (click)="removeRecipient(recipient)"
                                        aria-label="Remove {{ recipient }}"
                                    >
                                        <i class="pi pi-times"></i>
                                    </button>
                                </span>
                            }
                        </div>
                    }
                </div>

                <div class="flex flex-col gap-2">
                    <label for="subject" class="font-medium text-surface-900 dark:text-surface-0">Subject</label>
                    <input
                        id="subject"
                        pInputText
                        type="text"
                        formControlName="subject"
                        placeholder="Subject"
                        class="w-full"
                        tabindex="2"
                        aria-required="true"
                        aria-invalid="{{ !form.controls.subject.valid }}"
                    />
                </div>

                <div class="flex flex-col gap-2">
                    <label for="content" class="font-medium text-surface-900 dark:text-surface-0">Message</label>
                    <textarea
                        id="content"
                        pInputTextarea
                        rows="8"
                        formControlName="content"
                        placeholder="Write your message"
                        class="w-full"
                        tabindex="3"
                        aria-required="true"
                        aria-invalid="{{ !form.controls.content.valid }}"
                    ></textarea>
                </div>

                @if (sendError()) {
                    <div class="text-red-500" role="alert">{{ sendError() }}</div>
                }

                <div class="flex items-center gap-3">
                    <button pButton type="submit" label="Send" [disabled]="!canSubmit()" [loading]="loadingService.loading()" tabindex="4"></button>
                    <a pButton label="Cancel" severity="secondary" [outlined]="true" routerLink="/pages/messages/sent" tabindex="5"></a>
                </div>
            </form>
        </div>
    </div>
</div>
