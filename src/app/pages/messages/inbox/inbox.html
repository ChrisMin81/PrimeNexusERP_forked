@let messages = filteredMessages();

<div class="grid grid-cols-12 gap-6">
    <div class="col-span-12">
        <div class="card">
            <div class="flex flex-col gap-4">
                <app-mail-toolbar
                    title="Inbox"
                    [count]="messages?.length ?? 0"
                    searchLabel="Search Inbox"
                    (searchChange)="onSearch($event)"
                    (refresh)="refresh()"
                    (compose)="router.navigate(['/pages/messages/compose'])"
                    autocomplete="off"
                />

                <app-message-table
                    [messages]="messages"
                    context="inbox"
                    [loadingDeleteId]="deletingId()"
                    emptyIcon="pi pi-inbox"
                    emptyLabel="No messages found."
                    (open)="openMessage($event)"
                    (reply)="reply($event)"
                    (delete)="requestDelete($event)"
                    (attachments)="openAttachments($event.originalEvent, $event.message)"
                />
            </div>
        </div>
    </div>
</div>

<app-file-downloads-overlay
    [files]="attachmentList()"
    [visible]="attachmentsDialogOpen()"
    (close)="closeAttachments()"
    header="Attachments"
/>

<app-confirm-dialog
    [visible]="confirmDialogVisible()"
    header="Delete message"
    [message]="confirmDialogMessage()"
    confirmLabel="Delete"
    cancelLabel="Cancel"
    [confirmLoading]="deletingId() !== null"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
/>
