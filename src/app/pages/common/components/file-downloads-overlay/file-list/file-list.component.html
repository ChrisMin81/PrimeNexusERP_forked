<div class="flex flex-col gap-2">
    <span class="text-sm font-semibold">{{ header() }}</span>
    @if (!files().length) {
        <span class="text-muted-color text-sm">No {{ header() }}.</span>
    } @else {
        @for (file of files(); track file.auditUuid) {
            <a
                class="flex items-center gap-2 text-primary underline underline-offset-2"
                [href]="'data:application/octet-stream,' + (file.baseName || '')"
                [attr.download]="file.baseName"
            >
                <i class="pi pi-paperclip"></i>
                <span>{{ file.baseName }}</span>
            </a>
        }
    }
</div>
