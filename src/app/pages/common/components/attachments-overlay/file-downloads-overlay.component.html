<p-dialog
    [visible]="visible()"
    (onHide)="close.emit()"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [header]="header()"
    class="w-full md:w-6/12"
>
    <div class="flex flex-col gap-2">
        @if (!files().length) {
            <span class="text-muted-color text-sm">No {{header()}}.</span>
        } @else {
            @for (file of files(); track file.id) {
                <a
                    class="flex items-center gap-2 text-primary underline underline-offset-2"
                    [href]="'data:application/octet-stream,' + (file.name || '')"
                    [attr.download]="file.name"
                >
                    <i class="pi pi-paperclip"></i>
                    <span>{{ file.name }}</span>
                </a>
            }
        }
    </div>
</p-dialog>
