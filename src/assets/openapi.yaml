openapi: 3.0.1
info:
  title: Comino REST API
  description: Rest API for the Comino project
  contact:
    email: test@srv-05.camba.local
  version: 1.0.0
servers:
- url: https://localhost:8444/onlinebankingapi/
  description: Main Server
paths:
  /resources/openapi/secureOnlineBankingApi/AccountConfiguration/createConfirmationRequest/{clientAccountUuid}:
    get:
      description: Creates an account configuration confirmation request
      operationId: createAccountConfigurationConfirmationRequest
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the OnlineBankingAccountConfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperOnlineBankingAccountConfiguration'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountConfiguration/optOutFromVopRendered/{clientAccountUuid}:
    get:
      operationId: optOutFromVopRendered
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Verifies if opt out for VOP is rendered for specified account
            uuid
          content:
            application/json:
              schema:
                type: boolean
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountConfiguration/pending/{clientAccountUuid}:
    get:
      operationId: getPendingAccountConfiguration
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the related account configuration with status APPROVAL_PENDING
            for specified account uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineBankingAccountConfiguration'
      security:
      - bearerAuth: []
    delete:
      operationId: rejectPendingAccountConfiguration
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Rejects the related account configuration with status APPROVAL_PENDING
            for specified account uuid
          content:
            application/json:
              schema:
                type: boolean
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountConfiguration/retrieveConfirmationUpdate:
    get:
      description: Retrieves the account configuration to check its confirmation status
      operationId: retrieveAccountConfigurationConfirmationUpdate
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the account configuration to check its confirmation
            status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperOnlineBankingAccountConfiguration'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountConfiguration/vopOptOutAllowed/{clientAccountUuid}:
    get:
      operationId: optOutFromVopAllowed
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Verifies if opt out for VOP is possible for specified account
            uuid
          content:
            application/json:
              schema:
                type: boolean
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountConfiguration/{clientAccountUuid}:
    get:
      operationId: getAccountConfiguration
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the related account configuration with status ACTIVE
            for specified account uuid.Returns a new account configuration with status
            NEW in case no configuration could be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineBankingAccountConfiguration'
      security:
      - bearerAuth: []
    put:
      operationId: setAccountConfiguration
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialogWrapperOnlineBankingAccountConfiguration'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Sets the given account configuration for specified client account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperOnlineBankingAccountConfiguration'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountInformationService/loadAccountInformation/{clientAccountUuid}:
    get:
      operationId: loadAccountInformation
      parameters:
      - name: clientAccountUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: GIRO accounts for which the current user is allowed to view
            client accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineBankingAccountInformationWrapper'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountInformationService/loadGiroAccountsWithViewPermission:
    get:
      operationId: loadGiroAccountsWithViewPermission
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: GIRO accounts for which the current user is allowed to view
            client accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAccount'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/AccountInformationService/loadPortfolioAccountsWithViewPermission:
    get:
      operationId: loadPortfolioAccountsWithViewPermission
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Portfolios for which the current user is allowed to view orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/BulkUploadService/retrieveBulkProcessingStatus/{uuid}:
    get:
      description: Retrieves the latest update for specified online banking bulk
      operationId: retrieveBulkProcessingStatus
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the latest update for specified online banking bulk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesOnlineBankingBulkOrderProgress'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/BulkUploadService/uploadBulkOrder:
    post:
      description: "Uploads the given file, generates a new online banking bulk and\
        \ returns related UUID"
      operationId: uploadBulkOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileAttachement'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: UUID of the newly generated online banking bulk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesString'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/DerivativesService/loadDerivatives:
    get:
      operationId: loadDerivatives
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Retrieve list of derivatives where user has view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperCollectionForNonAuditedEntitiesOnlineBankingDerivativesWrapper'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/FaqService/getFAQs:
    get:
      operationId: getFAQs
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the list of frequently asked questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaqEntry'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingBulkUploadService/updateBulkProcessingWithUserResponses:
    post:
      operationId: updateBulkProcessingWithUserResponses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkProcessingRequest'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Update Bulk Processing according to the feedback of the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesOnlineBankingBulkOrderProgress'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingDocumentRepositoryService/loadDocument:
    post:
      description: Loads the document with the given fileUuid for the logged in partner.
      operationId: loadDocument
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: A documents' metadata for the given fileUuid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesDocumentWrapper'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingDocumentRepositoryService/loadDocumentList:
    post:
      description: "Loads the document lists associated with a specified partner,\
        \ filtered by dates, document type or document UUID. "
      operationId: loadDocumentList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRepositoryRequest'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: "A page of documents' metadata, filtered by the input parameters."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesDocumentRepositoryResultWrapper'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingExchangeRatesService/loadExchangeRates:
    get:
      operationId: loadExchangeRates
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: List of all exchanging rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConvertedMoneyAmount'
      security:
      - bearerAuth: []
  ? /resources/openapi/secureOnlineBankingApi/OnlineBankingExchangeRatesService/loadPaymentOrderExchangeRate/{sourceIsoCurrencyCode}/{sourceAmount}/{targetIsoCurrencyCode}
  : get:
      description: Calculates the exchange rate between the source and the target
        currency
      operationId: loadPaymentOrderExchangeRate
      parameters:
      - name: sourceIsoCurrencyCode
        in: path
        required: true
        schema:
          type: string
      - name: sourceAmount
        in: path
        required: true
        schema:
          type: number
      - name: targetIsoCurrencyCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: 'Returns the the exchange rate between the source and the target
            currency '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertedMoneyAmount'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/countAllInboundMessagesForUser:
    get:
      operationId: countAllInboundMessagesForUser
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Count all inbound message for the current user
          content:
            application/json:
              schema:
                type: integer
                format: int64
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/countAllOutboundMessagesForUser:
    get:
      operationId: countAllOutboundMessagesForUser
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Count all outbound message for the current user
          content:
            application/json:
              schema:
                type: integer
                format: int64
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/countUnreadInboundMessagesForUser:
    get:
      operationId: countUnreadInboundMessagesForUser
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Count unread inbound message for the current user
          content:
            application/json:
              schema:
                type: integer
                format: int64
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/downloadInboundMessageAttachment/{attachmentAuditUuid}:
    get:
      operationId: downloadInboundMessageAttachment
      parameters:
      - name: attachmentAuditUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Download inbound message attachment by attachment UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAttachment'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/downloadOutboundMessageAttachment/{attachmentAuditUuid}:
    get:
      operationId: downloadOutboundMessageAttachment
      parameters:
      - name: attachmentAuditUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Download outbound message attachment by attachment UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAttachment'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getActiveUserNotificationsForUI:
    get:
      operationId: getActiveUserNotificationsForUI
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Get inbound message for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserNotificationMessage'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getInboundMessageByUuid/{uuid}:
    get:
      operationId: getInboundMessageByUuid
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Get inbound message defined by uuid for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      security:
      - bearerAuth: []
  ? /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getInboundMessagesForCurrentUser/{pageIndex}/{paginationSize}/{sortingAttribute}/{sortingDirection}
  : get:
      operationId: getInboundMessagesForCurrentUser
      parameters:
      - name: pageIndex
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: paginationSize
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: sortingAttribute
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MessageSortingAttribute'
      - name: sortingDirection
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MessageSortingDirection'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Get inbound message for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getNotAcknowledgedInboundMessagesForCurrentUser:
    get:
      description: Get not acknowledged inbound messages for the current user
      operationId: getNotAcknowledgedInboundMessagesForCurrentUser
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: List with not acknowledged inbound messages for the current
            user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getOutboundMessageByUuid/{uuid}:
    get:
      operationId: getOutboundMessageByUuid
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Get outbound message defined by uuid for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      security:
      - bearerAuth: []
  ? /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getOutboundMessagesForCurrentUser/{pageIndex}/{paginationSize}/{sortingAttribute}/{sortingDirection}
  : get:
      operationId: getOutboundMessagesForCurrentUser
      parameters:
      - name: pageIndex
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: paginationSize
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: sortingAttribute
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MessageSortingAttribute'
      - name: sortingDirection
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MessageSortingDirection'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Get outbound message for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/getOutboundRecipients:
    get:
      operationId: getOutboundRecipients
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Get all outbound recipients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboundRecipient'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/markMessageAsAcknowledged/{messageAuditUuid}:
    get:
      operationId: markMessageAsAcknowledged
      parameters:
      - name: messageAuditUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Mark message specified by the given UUID as acknowledged
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/markMessageAsDeleted/{messageAuditUuid}:
    get:
      operationId: markMessageAsDeleted
      parameters:
      - name: messageAuditUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Mark message specified by the given UUID as deleted
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/markMessageAsRead/{messageAuditUuid}:
    get:
      operationId: markMessageAsRead
      parameters:
      - name: messageAuditUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Mark message specified by the given UUID as read
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/sendMessage:
    post:
      description: Validate and send message request
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSendingRequest'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Dialog wrapper containing whether sending was sucessful and
            eventual error messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesBoolean'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingMessageService/sendMessageToAdminsAndPaymentDepartment:
    post:
      description: Validate and send message request
      operationId: sendMessageToAdminsAndPaymentDepartment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSendingRequest'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Dialog wrapper containing whether sending was sucessfull and
            eventual error messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogWrapperForNonAuditedEntitiesBoolean'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingPaymentTemplateService/deleteOrderTemplate/{orderTemplateUUID}:
    get:
      description: Gets the payment order that is stored as template
      operationId: deleteOrderTemplate
      parameters:
      - name: orderTemplateUUID
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: The payment order that will be used as template
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingPaymentTemplateService/getNewOrderFromTemplate/{orderTemplateUUID}:
    get:
      description: Gets the payment order that is stored as template
      operationId: getNewOrderFromTemplate
      parameters:
      - name: orderTemplateUUID
        in: path
        required: true
        schema:
          type: string
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: The payment order that will be used as template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingPaymentTemplateService/getOrderTemplates:
    get:
      description: Retrieves the payment order templates for the current user
      operationId: getOrderTemplates
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: List with all payment orders templates for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderTemplate'
      security:
      - bearerAuth: []
  /resources/openapi/secureOnlineBankingApi/OnlineBankingPaymentTemplateService/storeOrderAsTemplate:
    post:
      description: Stores the provided payment order a template
      operationId: storeOrderAsTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTemplate'
      responses:
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Returns the stored payment order in a wrapper. The wrapper
            may contain error and warning message
