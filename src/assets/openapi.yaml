components:
  schemas:
    AbstractOrder:
      required:
      - auditUuid
      - orderNumber
      - recordingDate
      - recordingPartnerLoginId
      type: object
      properties:
        auditUuid:
          type: string
        fullySignedDate:
          type: string
          format: date-time
        orderNumber:
          maxLength: 16
          minLength: 9
          type: string
        orderType:
          type: string
        recordingDate:
          type: string
          format: date-time
        recordingPartnerLoginId:
          maxLength: 50
          minLength: 0
          type: string
      discriminator:
        propertyName: orderType
    AccountClass:
      type: string
      enum:
      - CLIENT_ACCOUNT
      - PORTFOLIO_ACCOUNT
      - TERM_DEPOSIT
    AccountClassStrings:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/AccountClass'
        value:
          type: array
          items:
            type: string
    AccountEntity:
      type: object
      properties:
        accountType:
          type: string
        closed:
          type: boolean
          readOnly: true
        mainAccountHolderName:
          type: string
          readOnly: true
      discriminator:
        propertyName: accountType
    AccountMatchResult:
      type: string
      enum:
      - FULL_MATCH
      - CLOSE_MATCH
      - NO_MATCH
      - NOT_APPLICABLE
      - TECHNICAL_PROBLEM
      - TECHNICAL_PROBLEM_PROVIDER_SIDE
      - VOP_OPT_OUT_BY_CUSTOMER
      - BENEFICIARY_BANK_NOT_ENABLED_FOR_VOP
    AccountOwnership:
      type: string
      enum:
      - CLIENT_ACCOUNT
      - PROPRIETORY
      - FEE_ONLY_ACCOUNT
      - TRADING_ACCOUNT
      - OPERATIONAL_ACCOUNT
      - INVESTMENT_CASH_ACCOUNT
      - VARIATION_MARGIN_ACCOUNT
      - SAFEGUARDING_ACCOUNT
      - LIQUIDITY_MANAGEMENT_ACCOUNT
      - SUBSCRIPTION_REDEMPTION_ACCOUNT
    AccountReferenceAccounts:
      required:
      - auditUuid
      type: object
      properties:
        accountReferenceIbans:
          type: array
          items:
            $ref: '#/components/schemas/AccountReferenceIban'
        auditUuid:
          type: string
    AccountReferenceBalances:
      required:
      - auditUuid
      type: object
      properties:
        accountReferenceIbans:
          type: array
          items:
            $ref: '#/components/schemas/AccountReferenceIban'
        auditUuid:
          type: string
    AccountReferenceIban:
      required:
      - auditUuid
      - iban
      type: object
      properties:
        auditUuid:
          type: string
        currency:
          maxLength: 3
          minLength: 0
          type: string
        iban:
          maxLength: 34
          minLength: 0
          type: string
    AccountReferenceTransactions:
      required:
      - auditUuid
      type: object
      properties:
        accountReferenceIbans:
          type: array
          items:
            $ref: '#/components/schemas/AccountReferenceIban'
        auditUuid:
          type: string
    AccountType:
      type: string
      enum:
      - GIRO
      - DEPOSIT
      - SECURITIES
    AdditionalServiceInformation:
      type: string
      enum:
      - ESIGNATURES
      - ESEALS
      - WEB_AUTHENTICATION
    AllPsd2Enum:
      type: string
      enum:
      - ALLACCOUNTS
    AvailableAccountsEnum:
      type: string
      enum:
      - ALLACCOUNTS
      - ALLACCOUNTSWIHTBALANCES
    BalanceType:
      type: string
      enum:
      - END_OF_DAY
      - INTRADAY
    BulkProcessingRequest:
      type: object
      properties:
        bulkOrderUuid:
          type: string
        ignoreAllWarnings:
          type: boolean
    BusinessProduct:
      type: object
      properties:
        onlineBankingProductName:
          maxLength: 50
          minLength: 0
          type: string
    CertificateToken:
      type: object
      properties:
        certificateTokenHash:
          type: string
        issuerToken:
          $ref: '#/components/schemas/CertificateToken'
        issuerx500Principal:
          type: string
        ncaId:
          type: string
        ncaName:
          type: string
        ncaRoles:
          type: array
          items:
            type: string
        serviceInfos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceInfo'
        x509CertificatePEMString:
          type: string
      xml:
        name: certificateToken
    ClientAccount:
      required:
      - accountCurrency
      - accountNumber
      - accountOwnership
      - auditUuid
      - businessProduct
      - iban
      - mainAccountHolder
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/AccountEntity'
      - type: object
        properties:
          accountNumber:
            maxLength: 25
            minLength: 1
            type: string
          name:
            maxLength: 100
            minLength: 1
            type: string
          auditUuid:
            type: string
          mainAccountHolder:
            $ref: '#/components/schemas/Partner'
          businessProduct:
            $ref: '#/components/schemas/BusinessProduct'
          description:
            maxLength: 2000
            minLength: 0
            type: string
          accountCurrency:
            $ref: '#/components/schemas/GozoCurrency'
          iban:
            maxLength: 31
            minLength: 31
            type: string
          accountOwnership:
            $ref: '#/components/schemas/AccountOwnership'
    ConsentStatus:
      type: string
      enum:
      - RECEIVED
      - REJECTED
      - VALID
      - REVOKEDBYPSU
      - EXPIRED
      - TERMINATEDBYTPP
    ConvertedMoneyAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/MoneyAmount'
      - type: object
        properties:
          source:
            $ref: '#/components/schemas/MoneyAmount'
          sourceToBaseRate:
            $ref: '#/components/schemas/ExchangeRate'
          baseToTargetRate:
            $ref: '#/components/schemas/ExchangeRate'
    CorrespondentBank:
      type: object
      properties:
        intermediaryAccount:
          maxLength: 35
          minLength: 0
          type: string
        intermediaryAccountThree:
          maxLength: 35
          minLength: 0
          type: string
        intermediaryAccountTwo:
          maxLength: 35
          minLength: 0
          type: string
        intermediaryBic:
          maxLength: 11
          minLength: 1
          pattern: "^([a-zA-Z]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}([a-zA-Z0-9]{3})?)$"
          type: string
